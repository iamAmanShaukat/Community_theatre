spring.application.name=community.theatre
## server port
#server.port=8080

#To connect locally
server.address=0.0.0.0

## DATABASE
#====================================
# local
#spring.datasource.url=jdbc:mysql://localhost:3306/***
#spring.datasource.username=root
#spring.datasource.password=

#AWS
spring.datasource.url=jdbc:mysql://***
spring.datasource.username=***
spring.datasource.password=****

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.initialization-mode=always

# JPA (Optional: For automatic table creation)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

#To upload image on cloudinary
cloudinary.cloud-name=***
cloudinary.api-key=****
cloudinary.api-secret=****

# To send email
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=*****
sendgrid.api.key=*****
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#Redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.ssl=true
spring.redis.timeout=2000ms

app.seat.lock.expiry=600
app.redis.temp.seat.lock.key=seat-lock:{eventId}:{showId}:{seat}
app.redis.booked.seat.lock.key=booked_seat_lock:{eventId}:{showId}

#JWT configuration for authentication
jwt.secret=****
jwt.expiration=86400000


